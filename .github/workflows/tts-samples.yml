# One-off open-source TTS sample generation for voice comparison.
# Runs ONLY on pushes to the voice-samples branch. It does not build,
# deploy, or modify the app; it just renders sample WAVs and uploads
# them as a workflow artifact.
name: TTS voice samples (MeloTTS)

on:
  push:
    branches: [voice-samples]

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MeloTTS (CPU torch)
        run: |
          # Pin matched CPU builds first: PyPI's torchaudio is a CUDA build
          # and breaks on runners without CUDA. MeloTTS itself goes in with
          # --no-deps so pip cannot replace them.
          pip install "torch==2.11.0" "torchaudio==2.11.0" --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/myshell-ai/MeloTTS.git --no-deps
          pip install txtsplit cached_path "transformers==4.27.4" "num2words==0.5.12" \
            "unidic_lite==1.0.8" "unidic==1.1.0" "mecab-python3==1.0.9" "pykakasi==2.2.1" \
            "fugashi==1.3.0" "g2p_en==2.1.0" "anyascii==0.3.2" "jamo==0.4.1" \
            "gruut[de,es,fr]==2.2.3" "g2pkk>=0.1.1" "librosa==0.9.1" "pydub==0.25.1" \
            "eng_to_ipa==0.0.2" "inflect==7.0.0" "unidecode==1.3.7" "pypinyin==0.50.0" \
            "cn2an==0.5.22" "jieba==0.42.1" "langid==1.1.6" tqdm "tensorboard==2.16.2" "loguru==0.7.2"
          python -m unidic download

      - name: Generate samples
        run: |
          mkdir -p samples
          python - <<'PY'
          from melo.api import TTS

          JOBS = [
              ("EN", "EN-US", "en-us-maya", "Hi, I'm Maya! Let's get moving. First up: jumping jacks."),
              ("EN", "EN-BR", "en-br-leo", "Steady now. Thirty seconds left. Keep that form nice and controlled."),
              ("EN", "EN-AU", "en-au-sofia", "Great work! Take a breather. Next up: squats. Last round, keep going!"),
              ("KR", "KR", "ko-maya", "안녕하세요, 마야예요! 시작해 볼까요? 첫 동작은 점핑잭이에요."),
              ("KR", "KR", "ko-marcus", "좋아요, 잘하고 있어요. 30초 남았어요. 마지막이에요. 끝까지 힘내세요!"),
          ]
          for lang, speaker, name, text in JOBS:
              model = TTS(language=lang, device="cpu")
              speaker_id = model.hps.data.spk2id[speaker]
              model.tts_to_file(text, speaker_id, f"samples/{name}.wav", speed=1.0)
              print("wrote", name)
          PY

      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: tts-samples
          path: samples/*.wav

      # Commit the WAVs back to this branch so they are downloadable
      # without an Actions login. [skip ci] keeps this push from
      # retriggering the workflow in a loop.
      - name: Commit samples to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/*.wav
          git commit -m "Add generated MeloTTS voice samples [skip ci]" || echo "no changes"
          git push
