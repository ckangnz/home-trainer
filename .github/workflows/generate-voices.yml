name: Generate coach voice clips

# Manual-only workflow: generates missing voice clips with the Gemini TTS free
# tier and commits them to the branch that triggered the run. Requires a
# GEMINI_API_KEY repository secret (free Google AI Studio key, no billing).
# Free tier daily limits are tight — prefer one trainer+language per run.

on:
  workflow_dispatch:
    inputs:
      trainer:
        description: 'Trainer id (female, marcus, … or all)'
        required: true
        default: 'female'
      lang:
        description: 'Language (ko, en, or all)'
        required: true
        default: 'ko'
      limit:
        description: 'Max clips this run (free-tier throttle control)'
        required: false
        default: '40'

permissions:
  contents: write

concurrency:
  group: voices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate missing clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run voices -- --trainer=${{ inputs.trainer }} --lang=${{ inputs.lang }} --limit=${{ inputs.limit }}

      - name: Commit new clips
        run: |
          if [ -z "$(git status --porcelain public/voices)" ]; then
            echo "No new clips"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/voices
          git commit -m "generate coach voice clips (${{ inputs.trainer }}, ${{ inputs.lang }})"
          git push
